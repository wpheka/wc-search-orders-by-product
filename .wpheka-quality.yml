# WPHEKA Quality configuration for WC Search Orders By Product.

project_type: woocommerce-plugin

php:
  minimum: "8.1"

wordpress:
  required: true

woocommerce:
  required: true
  hpos: true
  blocks: false

checks:
  php_syntax: true
  git_diff_check: true
  phpcs: true
  phpstan: true
  phpunit: true
  composer_validate: true
  composer_audit: true
  semgrep: true
  gitleaks: true
  plugin_check: true
  coderabbit: true
  npm: false

# Reviewed in its own repository against its own phpcs.xml. Its findings here are
# all the inherent PSR-4 versus WordPress filename conflict that its own ruleset
# excludes, so scanning it means the same noise in every consumer.
exclude:
  - framework/
  - languages/

fail_on: error
